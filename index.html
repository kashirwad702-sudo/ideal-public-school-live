<style>

*{

}

body{

<script>


/* =====================================================
   URL DATA
===================================================== */

const p =
  new URLSearchParams(
    location.search
  );


const liveId =
  p.get('liveId') || '';


const role =
  p.get('role') || 'student';


const userId =
  p.get('userId') || '';


const name =
  p.get('name') || '';


const cls =
  p.get('className') || '';


const appUrl =
  p.get('webAppUrl') || '';



/* =====================================================
   VARIABLES
===================================================== */

let peer = null;

let stream = null;

let teacherPeer = '';

let ready = false;

let joined = false;

let peerCalls = [];

let cameraFacing = 'user';



/* =====================================================
   SHORTCUT
===================================================== */

const $ =
  id =>
  document.getElementById(id);



/* =====================================================
   STATUS
===================================================== */

function st(text){

  $('status').textContent =
    text;

}



/* =====================================================
   FAIL
===================================================== */

function fail(text){

  st(text);

}



/* =====================================================
   DEBUG
===================================================== */

function debug(text){

  $('debug').textContent =
    text;

  console.log(
    '[LIVE]',
    text
  );

}



/* =====================================================
   SCHOOL APP API
===================================================== */

function api(action,data){

  return new Promise(
    (resolve,reject)=>{

      if(!appUrl){

        reject(
          new Error(
            'School app URL missing'
          )
        );

        return;
      }


      const cb =
        'cb_' +
        Date.now() +
        '_' +
        Math.random()
          .toString(36)
          .slice(2);


      const script =
        document.createElement(
          'script'
        );


      window[cb] =
        result => {

          try{
            delete window[cb];
          }catch(e){}

          script.remove();

          resolve(result);

        };


      script.onerror =
        () => {

          try{
            delete window[cb];
          }catch(e){}

          script.remove();

          reject(
            new Error(
              'School server unavailable'
            )
          );

        };


      script.src =
        appUrl +
        '?api=1' +
        '&action=' +
        encodeURIComponent(
          action
        ) +
        '&data=' +
        encodeURIComponent(
          JSON.stringify(data)
        ) +
        '&callback=' +
        cb;


      document.body.appendChild(
        script
      );

    }
  );

}



/* =====================================================
   UI
===================================================== */

function setupUI(){

  $('title').textContent =
    role === 'teacher'
      ? 'Teacher Live Room'
      : 'Class ' +
        cls +
        ' • Live Class';


  if(role === 'teacher'){

    $('teacherCameraCard')
      .classList
      .add('active');


    $('studentChat')
      .style
      .display =
      'none';

  }

  else{

    $('teacherCameraCard')
      .style
      .display =
      'none';

  }

}



/* =====================================================
   CREATE PEER
===================================================== */

async function makePeer(){

  return new Promise(
    (resolve,reject)=>{

      debug(
        'Connecting to PeerJS…'
      );


      peer =
        new Peer();


      peer.on(
        'open',
        id => {

          ready = true;

          debug(
            'PeerJS connected. ID: ' +
            id
          );

          resolve(id);

        }
      );


      peer.on(
        'error',
        error => {

          console.error(
            'PeerJS error:',
            error
          );


          fail(
            '❌ PeerJS error: ' +
            (
              error.type ||
              error.message
            )
          );


          debug(
            'PeerJS error: ' +
            (
              error.type ||
              error.message
            )
          );


          reject(error);

        }
      );


      peer.on(
        'disconnected',
        () => {

          st(
            '⚠️ PeerJS disconnected. Reconnecting…'
          );


          try{

            peer.reconnect();

          }catch(e){}

        }
      );


      peer.on(
        'close',
        () => {

          st(
            'Live connection closed.'
          );

        }
      );


      /* =====================================
         TEACHER RECEIVES STUDENT
      ===================================== */

      peer.on(
        'call',
        call => {

          console.log(
            'Incoming student call:',
            call.peer
          );


          if(role !== 'teacher'){

            return;

          }


          if(!stream){

            console.log(
              'Teacher stream unavailable'
            );

            call.close();

            return;

          }


          call.answer(
            stream
          );


          peerCalls.push(
            call
          );


          call.on(
            'close',
            () => {

              peerCalls =
                peerCalls.filter(
                  x => x !== call
                );

            }
          );


          call.on(
            'error',
            error => {

              console.error(
                'Teacher call error:',
                error
              );

            }
          );

        }
      );

    }
  );

}



/* =====================================================
   START TEACHER CAMERA
===================================================== */

async function startTeacherCamera(){

  try{

    /* =====================================
       HTTPS CHECK
    ===================================== */

    if(!window.isSecureContext){

      $('cameraStatus')
        .textContent =
        '❌ HTTPS जरूरी है।';

      fail(
        '❌ Camera के लिए HTTPS जरूरी है।'
      );

      return;

    }


    /* =====================================
       CAMERA API CHECK
    ===================================== */

    if(
      !navigator.mediaDevices ||
      !navigator.mediaDevices.getUserMedia
    ){

      $('cameraStatus')
        .textContent =
        '❌ Camera API उपलब्ध नहीं है।';

      fail(
        '❌ इस Chrome में Camera API उपलब्ध नहीं है।'
      );

      return;

    }


    $('startCam')
      .disabled =
      true;


    $('cameraStatus')
      .textContent =
      '📷 Camera permission मांगी जा रही है…';


    debug(
      'Requesting camera permission…'
    );


    /* =====================================
       STEP 1
       CAMERA ONLY
    ===================================== */

    let videoStream;


    try{

      videoStream =
        await navigator
          .mediaDevices
          .getUserMedia({

            video:{
              facingMode:{
                ideal:
                  cameraFacing
              },

              width:{
                ideal:1280
              },

              height:{
                ideal:720
              }

            },

            audio:false

          });


    }

    catch(cameraError){

      console.error(
        'CAMERA ERROR:',
        cameraError
      );


      $('startCam')
        .disabled =
        false;


      $('cameraStatus')
        .textContent =
        '❌ Camera Error: ' +
        cameraError.name;


      debug(
        'Camera Error: ' +
        cameraError.name +
        ' | ' +
        cameraError.message
      );


      if(
        cameraError.name ===
        'NotAllowedError'
      ){

        fail(
          '❌ Camera permission Chrome में Block है।'
        );

      }

      else if(
        cameraError.name ===
        'NotFoundError'
      ){

        fail(
          '❌ Camera device नहीं मिला।'
        );

      }

      else if(
        cameraError.name ===
        'NotReadableError'
      ){

        fail(
          '❌ Camera किसी दूसरे app में इस्तेमाल हो रहा है।'
        );

      }

      else{

        fail(
          '❌ Camera Error: ' +
          cameraError.name
        );

      }


      return;

    }



    /* =====================================
       CAMERA SUCCESS
    ===================================== */

    debug(
      '✅ Camera permission successful.'
    );


    /* =====================================
       STEP 2
       MICROPHONE
    ===================================== */

    $('cameraStatus')
      .textContent =
      '🟢 Camera चालू है। Microphone check हो रहा है…';


    let audioStream;


    try{

      audioStream =
        await navigator
          .mediaDevices
          .getUserMedia({

            video:false,

            audio:{
              echoCancellation:true,
              noiseSuppression:true,
              autoGainControl:true
            }

          });


      debug(
        '✅ Microphone permission successful.'
      );

    }

    catch(micError){

      console.warn(
        'MIC ERROR:',
        micError
      );


      audioStream =
        new MediaStream();


      debug(
        '⚠️ Microphone Error: ' +
        micError.name
      );

    }



    /* =====================================
       COMBINE STREAM
    ===================================== */

    stream =
      new MediaStream([

        ...videoStream
          .getVideoTracks(),

        ...audioStream
          .getAudioTracks()

      ]);



    /* =====================================
       SHOW LOCAL VIDEO
    ===================================== */

    $('local')
      .srcObject =
      stream;


    $('local').muted =
      true;


    try{

      await $('local')
        .play();

    }

    catch(e){

      console.log(
        'Local play:',
        e
      );

    }



    /* =====================================
       BUTTONS
    ===================================== */

    $('stopCam')
      .disabled =
      false;


    $('switchCam')
      .disabled =
      false;



    /* =====================================
       PEER
    ===================================== */

    if(!peer){

      await makePeer();

    }



    /* =====================================
       REGISTER PEER ID
    ===================================== */

    let result;


    try{

      result =
        await api(
          'setTeacherPeerId',
          {

            liveId:
              liveId,

            teacherId:
              userId,

            peerId:
              peer.id

          }
        );


    }

    catch(serverError){

      console.error(
        'SERVER ERROR:',
        serverError
      );


      $('cameraStatus')
        .textContent =
        '🟢 Camera चालू है';


      st(
        '⚠️ Camera चालू है लेकिन School Server से connection नहीं हुआ।'
      );


      debug(
        'Server Error: ' +
        serverError.message
      );


      return;

    }



    if(
      result &&
      result.success === false
    ){

      st(
        '⚠️ Camera चालू है लेकिन Teacher ID server में save नहीं हुई।'
      );


      debug(
        'Server rejected Teacher Peer ID.'
      );


      return;

    }



    /* =====================================
       SUCCESS
    ===================================== */

    const micOK =
      stream
        .getAudioTracks()
        .length > 0;


    if(micOK){

      $('cameraStatus')
        .textContent =
        '🟢 Camera + Microphone चालू है';

    }

    else{

      $('cameraStatus')
        .textContent =
        '🟢 Camera चालू है | ⚠️ Microphone नहीं मिला';

    }


    st(
      '🟢 Teacher Live शुरू हो गया। Students अब join कर सकते हैं।'
    );


    debug(
      '✅ Teacher Live Ready | Peer ID: ' +
      peer.id
    );



  }

  catch(error){

    console.error(
      'LIVE ERROR:',
      error
    );


    $('startCam')
      .disabled =
      false;


    $('stopCam')
      .disabled =
      true;


    $('switchCam')
      .disabled =
      true;


    $('cameraStatus')
      .textContent =
      '❌ Error: ' +
      error.name;


    fail(
      '❌ ' +
      error.name +
      ' — ' +
      error.message
    );


    debug(
      'Live Error: ' +
      error.name +
      ' | ' +
      error.message
    );

  }

}



/* =====================================================
   SWITCH CAMERA
===================================================== */

async function switchCamera(){

  if(!stream){

    return;

  }


  cameraFacing =
    cameraFacing === 'user'
      ? 'environment'
      : 'user';


  try{

    const newStream =
      await navigator
        .mediaDevices
        .getUserMedia({

          video:{
            facingMode:{
              ideal:
                cameraFacing
            },

            width:{
              ideal:1280
            },

            height:{
              ideal:720
            }

          },

          audio:false

        });


    const newVideoTrack =
      newStream
        .getVideoTracks()[0];


    if(!newVideoTrack){

      throw new Error(
        'Camera track missing'
      );

    }


    /* =====================================
       REPLACE TRACK
    ===================================== */

    peerCalls.forEach(
      call => {

        try{

          const sender =
            call
              .peerConnection
              ?.getSenders()
              ?.find(
                s =>
                  s.track &&
                  s.track.kind ===
                  'video'
              );


          if(sender){

            sender.replaceTrack(
              newVideoTrack
            );

          }

        }

        catch(e){

          console.error(e);

        }

      }
    );


    /* =====================================
       OLD CAMERA STOP
    ===================================== */

    const oldVideo =
      stream
        .getVideoTracks()[0];


    if(oldVideo){

      oldVideo.stop();

    }


    const audioTracks =
      stream
        .getAudioTracks();


    stream =
      new MediaStream([

        newVideoTrack,

        ...audioTracks

      ]);


    $('local')
      .srcObject =
      stream;


    if(
      cameraFacing ===
      'environment'
    ){

      $('switchCam')
        .textContent =
        '🔄 Front Camera';


      $('cameraStatus')
        .textContent =
        '🟢 Back Camera + Microphone चालू है';

    }

    else{

      $('switchCam')
        .textContent =
        '🔄 Back Camera';


      $('cameraStatus')
        .textContent =
        '🟢 Front Camera + Microphone चालू है';

    }


  }

  catch(error){

    console.error(
      'Camera switch error:',
      error
    );


    cameraFacing =
      cameraFacing === 'user'
        ? 'environment'
        : 'user';


    alert(
      'Camera switch नहीं हो पाया।'
    );

  }

}



/* =====================================================
   STOP CAMERA
===================================================== */

function stopTeacherCamera(){

  if(stream){

    stream
      .getTracks()
      .forEach(
        track =>
          track.stop()
      );

    stream =
      null;

  }


  $('local')
    .srcObject =
    null;


  $('stopCam')
    .disabled =
    true;


  $('switchCam')
    .disabled =
    true;


  $('startCam')
    .disabled =
    false;


  $('cameraStatus')
    .textContent =
    'Camera बंद है';


  debug(
    'Camera stopped.'
  );


  st(
    'Camera और Microphone बंद कर दिया गया।'
  );

}



/* =====================================================
   TEACHER INIT
===================================================== */

async function teacherInit(){

  st(
    'Teacher को PeerJS से connect किया जा रहा है…'
  );


  try{

    await makePeer();


    st(
      '🟢 Connected. अब Start Camera & Mic दबाएँ।'
    );


  }

  catch(error){

    console.error(error);

  }

}



/* =====================================================
   STUDENT JOIN
===================================================== */

async function studentJoin(){

  st(
    'Student live class से connect हो रहा है…'
  );


  try{

    await makePeer();

  }

  catch(error){

    return;

  }



  async function poll(){

    if(joined){

      return;

    }


    try{

      const result =
        await api(
          'getLiveTeacherPeerId',
          {

            liveId:
              liveId,

            className:
              cls

          }
        );


      if(!result.success){

        st(
          '⏳ Teacher के live शुरू करने का इंतजार…'
        );


        setTimeout(
          poll,
          2500
        );


        return;

      }


      if(!result.peerId){

        st(
          '⏳ Teacher camera का इंतजार…'
        );


        setTimeout(
          poll,
          2000
        );


        return;

      }


      teacherPeer =
        result.peerId;


      $('title')
        .textContent =
        (
          result.title ||
          'Live Class'
        ) +
        ' • ' +
        (
          result.teacherName ||
          'Teacher'
        );



      /* =================================
         CALL TEACHER
      ================================= */

      const call =
        peer.call(
          teacherPeer
        );


      if(!call){

        setTimeout(
          poll,
          2000
        );

        return;

      }


      call.on(
        'stream',
        remoteStream => {

          console.log(
            'Teacher stream received'
          );


          $('remote')
            .srcObject =
            remoteStream;


          $('remote')
            .play()
            .catch(
              () => {}
            );


          joined =
            true;


          st(
            '🟢 Teacher Live Video Connected.'
          );

        }
      );


      call.on(
        'close',
        () => {

          joined =
            false;


          st(
            'Teacher connection ended. Waiting…'
          );


          setTimeout(
            poll,
            2000
          );

        }
      );


      call.on(
        'error',
        error => {

          console.error(
            'Student call error:',
            error
          );


          joined =
            false;


          setTimeout(
            poll,
            2000
          );

        }
      );


    }

    catch(error){

      console.error(
        error
      );


      setTimeout(
        poll,
        3000
      );

    }

  }


  poll();

}



/* =====================================================
   SEND DOUBT
===================================================== */

async function sendDoubt(){

  const text =
    $('q')
      .value
      .trim();


  if(!text){

    return;

  }


  try{

    const result =
      await api(
        'sendLiveDoubt',
        {

          liveId:
            liveId,

          studentId:
            userId,

          studentName:
            name,

          className:
            cls,

          question:
            text

        }
      );


    if(result.success){

      $('q').value =
        '';

      refreshDoubts();

    }

    else{

      alert(
        result.message ||
        'Could not send doubt.'
      );

    }

  }

  catch(error){

    alert(
      'School server से connection नहीं हो पाया।'
    );

  }

}



/* =====================================================
   REFRESH DOUBTS
===================================================== */

async function refreshDoubts(){

  try{

    let data;


    if(role === 'teacher'){

      data =
        await api(
          'getLiveDoubts',
          {

            liveId:
              liveId,

            teacherId:
              userId

          }
        );

    }

    else{

      data =
        await api(
          'getStudentLiveDoubts',
          {

            liveId:
              liveId,

            studentId:
              userId

          }
        );

    }


    if(!Array.isArray(data)){

      data = [];

    }


    $('comments')
      .innerHTML =

      data
        .map(
          item => {

            if(role === 'teacher'){

              return `

                <div class="comment">

                  <b>
                    ${escapeHtml(
                      item.StudentName ||
                      'Student'
                    )}
                  </b>

                  :
                  ${escapeHtml(
                    item.Question ||
                    ''
                  )}

                  <br>

                  <small>

                    ${
                      item.Reply
                      ?
                      escapeHtml(
                        item.Reply
                      )
                      :
                      'Waiting for teacher reply…'
                    }

                  </small>

                  ${
                    item.Reply
                    ?
                    ''
                    :
                    `
                    <br>

                    <button
                      class="btn"
                      onclick="replyDoubt('${escapeHtml(item.DoubtID)}')"
                    >
                      Reply
                    </button>
                    `
                  }

                </div>

              `;

            }


            return `

              <div class="comment">

                <b>You:</b>

                ${escapeHtml(
                  item.Question ||
                  ''
                )}

                <br>

                <small>

                  ${
                    item.Reply
                    ?
                    escapeHtml(
                      item.Reply
                    )
                    :
                    'Waiting for teacher reply…'
                  }

                </small>

              </div>

            `;

          }
        )
        .join('')

      ||

      '<small>No doubts yet.</small>';


  }

  catch(error){

    console.log(
      'Doubt refresh error:',
      error
    );

  }

}



/* =====================================================
   REPLY DOUBT
===================================================== */

async function replyDoubt(id){

  const reply =
    prompt(
      'Reply to student:'
    );


  if(reply === null){

    return;

  }


  try{

    await api(
      'replyLiveDoubt',
      {

        doubtId:
          id,

        teacherId:
          userId,

        reply:
          reply

      }
    );


    refreshDoubts();

  }

  catch(error){

    alert(
      'Could not send reply.'
    );

  }

}



/* =====================================================
   ESCAPE HTML
===================================================== */

function escapeHtml(value){

  return String(
    value || ''
  )

  .replace(
    /&/g,
    '&amp;'
  )

  .replace(
    /</g,
    '&lt;'
  )

  .replace(
    />/g,
    '&gt;'
  )

  .replace(
    /"/g,
    '&quot;'
  )

  .replace(
    /'/g,
    '&#039;'
  );

}



/* =====================================================
   BUTTONS
===================================================== */

$('send')
  .onclick =
  sendDoubt;


$('q')
  .addEventListener(
    'keydown',
    event => {

      if(
        event.key ===
        'Enter'
      ){

        sendDoubt();

      }

    }
  );


$('startCam')
  .onclick =
  startTeacherCamera;


$('switchCam')
  .onclick =
  switchCamera;


$('stopCam')
  .onclick =
  stopTeacherCamera;



/* =====================================================
   PAGE CLOSE
===================================================== */

window.addEventListener(
  'beforeunload',
  () => {

    if(stream){

      stream
        .getTracks()
        .forEach(
          track =>
            track.stop()
        );

    }


    if(peer){

      peer.destroy();

    }

  }
);



/* =====================================================
   START APP
===================================================== */

(async function(){

  setupUI();


  /* =====================================
     REQUIRED DATA
  ===================================== */

  if(
    !liveId ||
    !userId ||
    !appUrl
  ){

    fail(
      '❌ Missing live class information. School App से Live खोलें।'
    );


    debug(
      'Required URL data missing: liveId / userId / webAppUrl'
    );


    return;

  }



  /* =====================================
     TEACHER
  ===================================== */

  if(
    role === 'teacher'
  ){

    await teacherInit();

  }



  /* =====================================
     STUDENT
  ===================================== */

  else{

    await studentJoin();

  }



  /* =====================================
     DOUBTS
  ===================================== */

  refreshDoubts();


  setInterval(
    refreshDoubts,
    3000
  );


})();

</script>
