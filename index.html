<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>IDEAL PUBLIC SCHOOL • Live Room</title>

<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#07110d;
  color:#fff;
}

.top{
  background:#087443;
  padding:14px 16px;
  font-weight:700;
}

.wrap{
  max-width:1050px;
  margin:auto;
  padding:14px;
}

.card{
  background:#101c17;
  border:1px solid #29483b;
  border-radius:14px;
  padding:12px;
  margin-bottom:12px;
}

.grid{
  display:grid;
  grid-template-columns:2fr 1fr;
  gap:12px;
}

.video{
  background:#000;
  border-radius:12px;
  overflow:hidden;
  min-height:260px;
  display:flex;
  align-items:center;
  justify-content:center;
}

.video video{
  width:100%;
  height:100%;
  min-height:260px;
  object-fit:contain;
  background:#000;
}

.teacherLocal{
  display:none;
}

.teacherLocal.active{
  display:block;
}

.studentLocal{
  display:none;
}

.status{
  padding:10px;
  border-radius:9px;
  background:#17251f;
  color:#d9f7e8;
}

.btn{
  border:0;
  border-radius:9px;
  padding:11px 14px;
  background:#0a9860;
  color:#fff;
  font-weight:700;
  cursor:pointer;
  margin:5px 5px 0 0;
}

.btn:disabled{
  opacity:.5;
  cursor:not-allowed;
}

.danger{
  background:#c93b3b;
}

.comments{
  height:280px;
  overflow:auto;
  border:1px solid #29483b;
  border-radius:10px;
  padding:8px;
}

.comment{
  padding:9px;
  border-bottom:1px solid #29483b;
}

.row{
  display:flex;
  gap:8px;
}

.row input{
  flex:1;
}

.input{
  width:100%;
  padding:11px;
  border:1px solid #355448;
  border-radius:9px;
  background:#0b1712;
  color:#fff;
}

small{
  color:#9db5aa;
}

.cameraButtons{
  display:flex;
  flex-wrap:wrap;
  gap:4px;
}

@media(max-width:760px){

  .grid{
    grid-template-columns:1fr;
  }

  .video,
  .video video{
    min-height:220px;
  }

  .wrap{
    padding:10px;
  }

}
</style>
</head>

<body>

<div class="top">
🏫 IDEAL PUBLIC SCHOOL • SECURE LIVE CLASS
</div>

<div class="wrap">

<!-- CONNECTION CARD -->
<div class="card">

  <b id="title">Connecting…</b>

  <div id="status"
       class="status"
       style="margin-top:8px">
    Preparing live room…
  </div>

  <div id="actions"
       style="margin-top:8px">
  </div>

</div>


<div class="grid">

<!-- LEFT SIDE -->
<div>

  <!-- TEACHER LIVE VIDEO -->
  <div class="card">

    <h3>📹 Teacher Live Video</h3>

    <div class="video">

      <video
        id="remote"
        autoplay
        playsinline>
      </video>

    </div>

  </div>


  <!-- TEACHER CAMERA -->
  <div
    class="card teacherLocal"
    id="teacherCameraCard">

    <h3>🎥 Teacher Camera & Microphone</h3>

    <div class="video">

      <video
        id="local"
        autoplay
        muted
        playsinline>
      </video>

    </div>

    <div
      id="cameraStatus"
      class="status"
      style="margin-top:8px">

      Camera बंद है

        🔄 Back Camera

        class="btn danger"
        id="stopCam"
        disabled>

        ⛔ Stop Camera

      </button>

    </div>

  </div>

</div>


<!-- RIGHT SIDE -->
<div class="card">

  <h3>💬 Student Doubts</h3>

  <div
    id="comments"
    class="comments">
  </div>

  <div
    id="studentChat"
    style="margin-top:10px">

    <div class="row">

      <input
        class="input"
        id="q"
        placeholder="Ask teacher…">

      <button
        class="btn"
        id="send">

        Send

      </button>

    </div>

  </div>

</div>

</div>
</div>


<script>

/* =====================================================
   BASIC DATA
===================================================== */

const p =
  new URLSearchParams(location.search);

const liveId =
  p.get('liveId') || '';

const role =
  p.get('role') || 'student';

const userId =
  p.get('userId') || '';

const name =
  p.get('name') || '';

const cls =
  p.get('className') || '';

const appUrl =
  p.get('webAppUrl') || '';


/* =====================================================
   VARIABLES
===================================================== */

let peer = null;

let stream = null;

let teacherPeer = '';

let ready = false;

let joined = false;

let peerCalls = [];

let cameraFacing = 'user';


/* =====================================================
   SHORTCUT
===================================================== */

const $ =
  id => document.getElementById(id);


/* =====================================================
   STATUS
===================================================== */

function st(text){

  $('status').textContent = text;

}


/* =====================================================
   ERROR
===================================================== */

function fail(text){

  st('❌ ' + text);

}


/* =====================================================
   SCHOOL APP API
===================================================== */

function api(action,data){

  return new Promise((resolve,reject)=>{

    if(!appUrl){

      reject(
        new Error(
          'School app URL missing'
        )
      );

      return;
    }

    const cb =
      'cb_' +
      Date.now() +
      '_' +
      Math.random()
        .toString(36)
        .slice(2);

    const script =
      document.createElement('script');

    window[cb] =
      result => {

        try{
          delete window[cb];
        }catch(e){}

        script.remove();

        resolve(result);

      };

    script.onerror = () => {

      try{
        delete window[cb];
      }catch(e){}

      script.remove();

      reject(
        new Error(
          'School server unavailable'
        )
      );

    };

    script.src =
      appUrl +
      '?api=1' +
      '&action=' +
      encodeURIComponent(action) +
      '&data=' +
      encodeURIComponent(
        JSON.stringify(data)
      ) +
      '&callback=' +
      cb;

    document.body.appendChild(script);

  });

}


/* =====================================================
   UI SETUP
===================================================== */

function setupUI(){

  $('title').textContent =
    role === 'teacher'
      ? 'Teacher Live Room'
      : 'Class ' +
        cls +
        ' • Live Class';


  if(role === 'teacher'){

    $('teacherCameraCard')
      .classList
      .add('active');

    $('studentChat')
      .style
      .display = 'none';

    $('actions').innerHTML =

      '<button class="btn" id="openCamera">' +
      '🎥 Start Camera & Mic' +
      '</button>';

    $('openCamera').onclick =
      startTeacherCamera;

  }

  else{

    $('teacherCameraCard')
      .style
      .display = 'none';

  }

}


/* =====================================================
   CREATE PEER
===================================================== */

async function makePeer(){

  return new Promise(
    (resolve,reject)=>{

      peer =
        new Peer();

      peer.on(
        'open',
        id => {

          ready = true;

          console.log(
            'Peer connected:',
            id
          );

          resolve(id);

        }
      );


      peer.on(
        'error',
        error => {

          console.error(
            'PeerJS error:',
            error
          );

          fail(
            'Connection error: ' +
            (
              error.type ||
              error.message ||
              'PeerJS'
            )
          );

          reject(error);

        }
      );


      peer.on(
        'disconnected',
        () => {

          st(
            'Connection interrupted. Reconnecting…'
          );

          try{

            peer.reconnect();

          }catch(e){}

        }
      );


      peer.on(
        'close',
        () => {

          st(
            'Live connection closed.'
          );

        }
      );


      /*
        TEACHER RECEIVES STUDENT CALL
      */

      peer.on(
        'call',
        call => {

          console.log(
            'Incoming call from:',
            call.peer
          );

          if(role !== 'teacher'){

            return;

          }

          if(!stream){

            console.log(
              'Teacher camera not ready'
            );

            call.close();

            return;

          }

          call.answer(stream);

          call.on(
            'close',
            () => {

              console.log(
                'Student call closed'
              );

            }
          );

          call.on(
            'error',
            error => {

              console.error(
                'Call error:',
                error
              );

            }
          );

          peerCalls.push(call);

        }
      );

    }
  );

}


/* =====================================================
   START TEACHER CAMERA
===================================================== */

async function startTeacherCamera(){

  try{

    /*
      HTTPS CHECK
    */

    if(
      !window.isSecureContext
    ){

      fail(
        'Camera के लिए HTTPS जरूरी है। ' +
        'Live Room को HTTPS link से खोलें।'
      );

      return;

    }


    /*
      CAMERA API CHECK
    */

    if(
      !navigator.mediaDevices ||
      !navigator.mediaDevices.getUserMedia
    ){

      fail(
        'इस browser में Camera/Microphone उपलब्ध नहीं है। Chrome में Live Room खोलें।'
      );

      return;

    }


    $('cameraStatus')
      .textContent =
      'Camera और Microphone permission मांगी जा रही है…';


    $('startCam')
      .disabled = true;


    /*
      OLD STREAM STOP
    */

    if(stream){

      stream
        .getTracks()
        .forEach(
          track => track.stop()
        );

      stream = null;

    }


    /*
      REQUEST CAMERA + MICROPHONE
    */

    stream =
      await navigator
        .mediaDevices
        .getUserMedia({

          video:{

            facingMode:{
              ideal:cameraFacing
            },

            width:{
              ideal:1280
            },

            height:{
              ideal:720
            }

          },

          audio:{

            echoCancellation:true,

            noiseSuppression:true,

            autoGainControl:true

          }

        });


    /*
      SHOW LOCAL VIDEO
    */

    $('local')
      .srcObject = stream;


    $('stopCam')
      .disabled = false;


    $('switchCam')
      .disabled = false;


    $('cameraStatus')
      .textContent =
      cameraFacing === 'environment'
        ? '🟢 Back Camera + Microphone चालू है'
        : '🟢 Front Camera + Microphone चालू है';


    /*
      CREATE PEER
    */

    if(!peer){

      await makePeer();

    }


    /*
      SEND TEACHER PEER ID
      TO SCHOOL SERVER
    */

    const result =
      await api(
        'setTeacherPeerId',
        {

          liveId:liveId,

          teacherId:userId,

          peerId:peer.id

        }
      );


    if(
      result &&
      result.success === false
    ){

      st(
        '⚠️ Camera चालू है लेकिन Live server से connection नहीं हुआ।'
      );

      return;

    }


    st(
      '🟢 Live शुरू हो गया। Students अब join कर सकते हैं।'
    );


  }

  catch(error){

    console.error(
      'CAMERA ERROR:',
      error
    );


    $('startCam')
      .disabled = false;


    $('stopCam')
      .disabled = true;


    $('switchCam')
      .disabled = true;


    let message =
      'Camera/Microphone permission नहीं मिली।';


    if(
      error.name ===
      'NotAllowedError'
    ){

      message =
        'Camera/Microphone permission Block है। Chrome में इस site की Camera और Microphone permission Allow करें।';

    }

    else if(
      error.name ===
      'NotFoundError'
    ){

      message =
        'Camera या Microphone device नहीं मिला।';

    }

    else if(
      error.name ===
      'NotReadableError'
    ){

      message =
        'Camera किसी दूसरे app में इस्तेमाल हो रहा है। दूसरे camera app को बंद करें।';

    }

    else if(
      error.name ===
      'SecurityError'
    ){

      message =
        'Browser ने security कारण से Camera access रोक दिया। HTTPS Live Room खोलें।';

    }


    $('cameraStatus')
      .textContent =
      '❌ ' + message;


    fail(message);

  }

}


/* =====================================================
   SWITCH FRONT / BACK CAMERA
===================================================== */

async function switchCamera(){

  if(!stream){

    return;

  }


  /*
    CHANGE CAMERA
  */

  cameraFacing =
    cameraFacing === 'user'
      ? 'environment'
      : 'user';


  try{

    /*
      GET NEW CAMERA
    */

    const newStream =
      await navigator
        .mediaDevices
        .getUserMedia({

          video:{

            facingMode:{
              ideal:cameraFacing
            },

            width:{
              ideal:1280
            },

            height:{
              ideal:720
            }

          },

          audio:false

        });


    const newVideoTrack =
      newStream
        .getVideoTracks()[0];


    if(!newVideoTrack){

      throw new Error(
        'New camera track missing'
      );

    }


    /*
      REPLACE VIDEO TRACK
      IN ALL PEER CALLS
    */

    peerCalls.forEach(
      call => {

        try{

          const sender =
            call
              .peerConnection
              ?.getSenders()
              ?.find(
                s =>
                  s.track &&
                  s.track.kind ===
                  'video'
              );


          if(sender){

            sender.replaceTrack(
              newVideoTrack
            );

          }

        }catch(error){

          console.error(
            'Track replace error:',
            error
          );

        }

      }
    );


    /*
      OLD VIDEO TRACK STOP
    */

    const oldVideoTrack =
      stream
        .getVideoTracks()[0];


    if(oldVideoTrack){

      oldVideoTrack.stop();

    }


    /*
      KEEP MICROPHONE
    */

    const audioTracks =
      stream
        .getAudioTracks();


    /*
      CREATE NEW STREAM
    */

    stream =
      new MediaStream([
        newVideoTrack,
        ...audioTracks
      ]);


    /*
      SHOW NEW CAMERA
    */

    $('local')
      .srcObject = stream;


    /*
      UPDATE BUTTON
    */

    if(
      cameraFacing ===
      'environment'
    ){

      $('switchCam')
        .textContent =
        '🔄 Front Camera';

      $('cameraStatus')
        .textContent =
        '🟢 Back Camera + Microphone चालू है';

    }

    else{

      $('switchCam')
        .textContent =
        '🔄 Back Camera';

      $('cameraStatus')
        .textContent =
        '🟢 Front Camera + Microphone चालू है';

    }


  }

  catch(error){

    console.error(
      'Camera switch error:',
      error
    );


    /*
      FALLBACK
    */

    try{

      const newStream =
        await navigator
          .mediaDevices
          .getUserMedia({

            video:{
              facingMode:
                cameraFacing
            },

            audio:false

          });


      const newVideoTrack =
        newStream
          .getVideoTracks()[0];


      peerCalls.forEach(
        call => {

          try{

            const sender =
              call
                .peerConnection
                ?.getSenders()
                ?.find(
                  s =>
                    s.track &&
                    s.track.kind ===
                    'video'
                );


            if(sender){

              sender.replaceTrack(
                newVideoTrack
              );

            }

          }catch(e){}

        }
      );


      const oldVideoTrack =
        stream
          .getVideoTracks()[0];


      if(oldVideoTrack){

        oldVideoTrack.stop();

      }


      stream =
        new MediaStream([

          newVideoTrack,

          ...stream
            .getAudioTracks()

        ]);


      $('local')
        .srcObject = stream;


    }

    catch(finalError){

      alert(
        'Camera switch नहीं हो पाया। Phone में दूसरा camera उपलब्ध है या नहीं check करें।'
      );

    }

  }

}


/* =====================================================
   STOP TEACHER CAMERA
===================================================== */

function stopTeacherCamera(){

  if(stream){

    stream
      .getTracks()
      .forEach(
        track => track.stop()
      );

    stream = null;

  }


  $('local')
    .srcObject = null;


  $('stopCam')
    .disabled = true;


  $('switchCam')
    .disabled = true;


  $('startCam')
    .disabled = false;


  $('cameraStatus')
    .textContent =
    'Camera बंद है';


  st(
    'Camera और Microphone बंद कर दिया गया।'
  );

}


/* =====================================================
   TEACHER INIT
===================================================== */

async function teacherInit(){

  st(
    'Connecting teacher to live server…'
  );


  try{

    await makePeer();


    st(
      'Connected. Tap “Start Camera & Mic”.'
    );


  }

  catch(error){

    return;

  }

}


/* =====================================================
   STUDENT JOIN
===================================================== */

async function studentJoin(){

  st(
    'Connecting to live class…'
  );


  try{

    await makePeer();

  }

  catch(error){

    return;

  }


  async function poll(){

    if(joined){

      return;

    }


    try{

      const result =
        await api(
          'getLiveTeacherPeerId',
          {
            liveId:liveId,
            className:cls
          }
        );


      if(!result.success){

        st(
          'Waiting for teacher to start camera…'
        );

        setTimeout(
          poll,
          2500
        );

        return;

      }


      if(!result.peerId){

        st(
          'Teacher is connected. Waiting for camera…'
        );

        setTimeout(
          poll,
          2000
        );

        return;

      }


      teacherPeer =
        result.peerId;


      $('title').textContent =
        (
          result.title ||
          'Live Class'
        ) +
        ' • ' +
        (
          result.teacherName ||
          'Teacher'
        );


      /*
        CALL TEACHER
      */

      const call =
        peer.call(
          teacherPeer
        );


      if(!call){

        setTimeout(
          poll,
          2000
        );

        return;

      }


      call.on(
        'stream',
        remoteStream => {

          console.log(
            'Teacher stream received'
          );


          $('remote')
            .srcObject =
            remoteStream;


          $('remote')
            .play()
            .catch(
              () => {}
            );


          joined = true;


          st(
            '🟢 Live video connected.'
          );

        }
      );


      call.on(
        'close',
        () => {

          joined = false;

          st(
            'Teacher connection ended. Waiting…'
          );


          setTimeout(
            poll,
            2000
          );

        }
      );


      call.on(
        'error',
        error => {

          console.error(
            'Student call error:',
            error
          );


          joined = false;


          setTimeout(
            poll,
            2000
          );

        }
      );


    }

    catch(error){

      console.error(
        error
      );


      setTimeout(
        poll,
        3000
      );

    }

  }


  poll();

}


/* =====================================================
   SEND STUDENT DOUBT
===================================================== */

async function sendDoubt(){

  const text =
    $('q')
      .value
      .trim();


  if(!text){

    return;

  }


  try{

    const result =
      await api(
        'sendLiveDoubt',
        {

          liveId:liveId,

          studentId:userId,

          studentName:name,

          className:cls,

          question:text

        }
      );


    if(result.success){

      $('q').value = '';

      refreshDoubts();

    }

    else{

      alert(
        result.message ||
        'Could not send doubt.'
      );

    }

  }

  catch(error){

    alert(
      'Could not reach school server.'
    );

  }

}


/* =====================================================
   REFRESH DOUBTS
===================================================== */

async function refreshDoubts(){

  try{

    let data;


    if(role === 'teacher'){

      data =
        await api(
          'getLiveDoubts',
          {
            liveId:liveId,
            teacherId:userId
          }
        );

    }

    else{

      data =
        await api(
          'getStudentLiveDoubts',
          {
            liveId:liveId,
            studentId:userId
          }
        );

    }


    if(!Array.isArray(data)){

      data = [];

    }


    $('comments')
      .innerHTML =


      data
        .map(
          item => {


            if(role === 'teacher'){

              return `

                <div class="comment">

                  <b>
                    ${escapeHtml(
                      item.StudentName ||
                      'Student'
                    )}
                  </b>

                  :
                  ${escapeHtml(
                    item.Question ||
                    ''
                  )}

                  <br>

                  <small>

                    ${
                      item.Reply
                        ? escapeHtml(
                            item.Reply
                          )
                        : 'Waiting for teacher reply…'
                    }

                  </small>

                  ${
                    item.Reply
                    ? ''
                    :
                    `<br>
                     <button
                       class="btn"
                       onclick="replyDoubt('${escapeHtml(item.DoubtID)}')">
                       Reply
                     </button>`
                  }

                </div>

              `;

            }


            return `

              <div class="comment">

                <b>You:</b>

                ${escapeHtml(
                  item.Question ||
                  ''
                )}

                <br>

                <small>

                  ${
                    item.Reply
                      ? escapeHtml(
                          item.Reply
                        )
                      : 'Waiting for teacher reply…'
                  }

                </small>

              </div>

            `;

          }
        )
        .join('')


      ||

      '<small>No doubts yet.</small>';


  }

  catch(error){

    console.log(
      'Doubt refresh error:',
      error
    );

  }

}


/* =====================================================
   REPLY DOUBT
===================================================== */

async function replyDoubt(id){

  const reply =
    prompt(
      'Reply to student:'
    );


  if(reply === null){

    return;

  }


  try{

    await api(
      'replyLiveDoubt',
      {

        doubtId:id,

        teacherId:userId,

        reply:reply

      }
    );


    refreshDoubts();

  }

  catch(error){

    alert(
      'Could not send reply.'
    );

  }

}


/* =====================================================
   ESCAPE HTML
===================================================== */

function escapeHtml(value){

  return String(value || '')
    .replace(
      /&/g,
      '&amp;'
    )
    .replace(
      /</g,
      '&lt;'
    )
    .replace(
      />/g,
      '&gt;'
    )
    .replace(
      /"/g,
      '&quot;'
    )
    .replace(
      /'/g,
      '&#039;'
    );

}


/* =====================================================
   BUTTONS
===================================================== */

$('send').onclick =
  sendDoubt;


$('q').addEventListener(
  'keydown',
  event => {

    if(
      event.key ===
      'Enter'
    ){

      sendDoubt();

    }

  }
);


$('startCam').onclick =
  startTeacherCamera;


$('switchCam').onclick =
  switchCamera;


$('stopCam').onclick =
  stopTeacherCamera;


/* =====================================================
   PAGE CLOSE
===================================================== */

window.addEventListener(
  'beforeunload',
  () => {

    if(stream){

      stream
        .getTracks()
        .forEach(
          track => track.stop()
        );

    }


    if(peer){

      peer.destroy();

    }

  }
);


/* =====================================================
   START APPLICATION
===================================================== */

(async function(){

  setupUI();


  /*
    REQUIRED INFORMATION
  */

  if(
    !liveId ||
    !userId ||
    !appUrl
  ){

    return fail(
      'Missing live class information. Please open Live from the School App.'
    );

  }


  /*
    TEACHER
  */

  if(
    role === 'teacher'
  ){

    await teacherInit();

  }


  /*
    STUDENT
  */

  else{

    await studentJoin();

  }


  /*
    DOUBTS
  */

  refreshDoubts();


  setInterval(
    refreshDoubts,
    3000
  );

})();

</script>
